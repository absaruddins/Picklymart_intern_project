<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line is required to make the page responsive on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (for the icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Public Sans (matches the original design) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Our own CSS -->
  <link rel="stylesheet" href="style.css">
  <title>Contact Us - Picklymart</title>
</head>
<!-- data-protected="true" = user must be logged in to see this page (checked in script.js) -->
<body data-protected="true">

  <!-- navbar.html will be placed here -->
  <div id="navbar"></div>

  <main>
    <div class="container">
      <div class="contact-box">
        <!-- row = one line, col-lg-6 = half width on large screens, stacked on small screens -->
        <div class="row">

          <!-- Left side: address, phone, email -->
          <div class="col-lg-6 mb-4">
            <h2 class="fw-bold mb-4">Contact us</h2>

            <!-- The details (info-detail) are hidden until the mouse is over this row -->
            <div class="info-item d-flex gap-3 mb-4" tabindex="0">
              <div class="round-icon"><i class="bi bi-geo-alt"></i></div>
              <div>
                <strong>Address</strong>
                <span class="info-detail">Chattogram 4225</span>
              </div>
            </div>

            <!-- The details (info-detail) are hidden until the mouse is over this row -->
            <div class="info-item d-flex gap-3 mb-4" tabindex="0">
              <div class="round-icon"><i class="bi bi-telephone"></i></div>
              <div>
                <strong>Phone</strong>
                <span class="info-detail">+880 1XXX-XXXXXX</span>
              </div>
            </div>

            <!-- The details (info-detail) are hidden until the mouse is over this row -->
            <div class="info-item d-flex gap-3 mb-4" tabindex="0">
              <div class="round-icon"><i class="bi bi-envelope"></i></div>
              <div>
                <strong>Email Address</strong>
                <span class="info-detail">info@geniuszoo.com</span>
              </div>
            </div>
          </div>

          <!-- Right side: contact form -->
          <div class="col-lg-6">
            <!-- novalidate = turn off the browser's default messages, we use Bootstrap's instead -->
            <form class="form-box my-form" novalidate>

              <label class="form-label">Name</label>
              <input type="text" class="form-control mb-3" placeholder="Enter Name" required>

              <label class="form-label">Email</label>
              <input type="email" class="form-control mb-3" placeholder="Enter Email" required>

              <label class="form-label">Phone no. (optional)</label>
              <input type="tel" class="form-control mb-3" placeholder="Enter Phone">

              <label class="form-label">Tell us about your query</label>
              <textarea class="form-control mb-3" rows="3" placeholder="Type here..." required></textarea>

              <button type="submit" class="btn btn-green">Submit</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- footer.html will be placed here -->
  <div id="footer"></div>

  <!-- Bootstrap JS (needed for the hamburger menu) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JS (loads navbar and footer) -->
  <script src="js/script.js"></script>
</body>
</html>
