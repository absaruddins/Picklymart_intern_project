<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Login - Picklymart</title>
</head>

<body data-guest="true">

  <!-- navbar.html -->
  <div id="navbar"></div>

  <main>
    <div class="container px-3">
      <form id="loginForm" class="auth-box" novalidate>
        <h2 class="mb-4">Login</h2>

        <label class="form-label">Email</label>
        <input type="email" class="form-control mb-3" placeholder="Enter Email" required>

        
        <label class="form-label">Password</label>
        <input type="password" class="form-control mb-3" placeholder="Enter Password" minlength="6" required>

        
        <div id="message" class="alert alert-danger d-none"></div>

        <button type="submit" class="btn btn-green w-100">Login</button>

        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </form>
    </div>
  </main>

  <!-- footer.html -->
  <div id="footer"></div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- loads navbar and footer)-->
  <script src="js/script.js"></script>
</body>
</html>
